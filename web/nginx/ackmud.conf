# nginx configuration for ackmud.com and aha.ackmud.com
#
# Deploy to: /etc/nginx/conf.d/ackmud.conf
#
# Prerequisites:
#   - Let's Encrypt certificate covering ackmud.com and aha.ackmud.com
#     (either a wildcard *.ackmud.com cert, or a multi-SAN cert obtained with:
#      certbot --expand -d ackmud.com -d aha.ackmud.com ...)
#   - The Python web server (web_who_server.py) running on 127.0.0.1:8080
#     (set ACK_WEB_PORT=8080 so it doesn't need root)
#
# After deploying:
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redirect HTTP → HTTPS for both domains ──────────────────────────────────
server {
    listen      80;
    server_name ackmud.com aha.ackmud.com;
    return 301 https://$host$request_uri;
}

# ── Main site: ackmud.com — AHA: World of Lore ──────────────────────────────
server {
    listen      443 ssl;
    server_name ackmud.com;

    ssl_certificate     /etc/letsencrypt/live/ackmud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ackmud.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Proxy all requests to the Python web server.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Archive sub-site: aha.ackmud.com — ACKmud Historical Archive ─────────────
#
# Requests to aha.ackmud.com are proxied to the same Python web server.
# The server detects the "aha." hostname prefix and redirects "/" to "/aha/",
# so visitors to https://aha.ackmud.com/ land on the archive landing page.
# All other paths (/reference/, /img/, etc.) pass through normally.
server {
    listen      443 ssl;
    server_name aha.ackmud.com;

    # Re-use the same certificate if it covers aha.ackmud.com as a SAN.
    # If using separate certs, update these paths accordingly.
    ssl_certificate     /etc/letsencrypt/live/ackmud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ackmud.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
